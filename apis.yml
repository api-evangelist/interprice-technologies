x-shutdown-note: >-
  Wound down during 2025. Founder and CEO Olga Chin's tenure ended February 2025 and she is now
  a managing director at Tradeweb; the last Wayback capture of interpricetech.com is 2025-01-26
  and the site's DNS was torn down thereafter. No bankruptcy, acquisition, or shutdown
  announcement was found in public sources — the wind-down is evidenced by the deleted DNS zone,
  the halt in archive captures, and the founder's departure, not by a company statement.
x-domain-status: unresolvable
x-domain-note: >-
  interpricetech.com remains registered at GoDaddy (created 2019-05-28, registry expiry
  2027-05-28) and the .com registry still delegates it to two Route 53 nameservers
  (ns-935.awsdns-52.net, ns-1989.awsdns-56.co.uk), but the hosted zone behind them is gone: both
  nameservers answer REFUSED, so every public resolver fails and no HTTP request to any
  interpricetech.com host can complete. All 160 contract-discovery probes across ten hosts
  returned curl exit 6 (could not resolve host), not an HTTP status. The domain is therefore
  deliberately NOT wired as a Website pointer. Separately, interprice.com is not and never was
  the company's domain — it was registered in 2002, sits with the registrar Media Elite Holdings,
  and redirects to an unrelated advertising lander.
x-venue-listing: >-
  This company entered the network from the secondary-market harvest with
  https://www.nasdaqprivatemarket.com/ wired as its Website. That is the trading venue's own
  homepage, not an InterPrice property, and it does not even deep-link to an InterPrice listing;
  it was removed on 2026-08-23 as false discoverability credit (roadmap#56, venue-listing-as-Website).
  A probe-domain-security.py run on 2026-08-23 followed that pointer and wrote Nasdaq Private
  Market's TLS/HSTS/SPF/DMARC posture into a DomainSecurity artifact attributed to InterPrice;
  that artifact and its pointer were deleted.
