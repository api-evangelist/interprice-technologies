aid: interprice-technologies
name: InterPrice Technologies
description: >-
  InterPrice Technologies, Inc. was a New York City debt capital markets fintech that gave
  corporate treasury teams a single web platform for new-issue financing decisions. Founded by
  Olga Chin and commercially launched in 2020, its treasury capital markets platform aggregated
  the indicative pricing that banks and financing partners supplied for bonds, commercial paper,
  loans and hedging, normalized it across currencies and products, and presented it in comparison
  dashboards so CFOs and treasurers could read funding costs side by side instead of collecting
  them by email and spreadsheet. The company was WBENC-certified as a woman-owned business,
  raised roughly $9.8M — a $2.5M seed in March 2021 and a $7.3M Series A in November 2022 co-led
  by Nasdaq Ventures and DRW Venture Capital with Bowery Capital participating — and named
  HP Inc., McCormick & Company and Takeda Pharmaceuticals among its corporate treasury customers.
  In March 2023 it announced bank API connectivity, but that was an inbound integration through
  which relationship banks delivered pricing indications into the InterPrice platform for its own
  tenants; no public developer portal, API reference, key issuance, or machine-readable
  specification was ever published, and none appears anywhere in the 983 archived URLs captured
  for the domain. The company wound down during 2025 — founder and chief executive Olga Chin
  left in February 2025 and is now a managing director at Tradeweb, the last Wayback capture of
  the site is 2025-01-26, and interpricetech.com now has an empty DNS delegation — so this
  profile is retained as a historical record and there is no API surface to enrich.
